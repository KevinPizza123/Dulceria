<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventario - Dulcería</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <header class="bg-pink-600 text-white shadow">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold tracking-tight">🍬 Inventario de Dulcería</h1>
      <a href="/docs" target="_blank" class="text-sm bg-pink-700 hover:bg-pink-800 px-3 py-1.5 rounded">
        Ver API Docs
      </a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6 space-y-6">

    <!-- Panel de Alertas -->
    <section id="panel-alertas" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4">
      <div id="alerta-stock" class="hidden bg-amber-50 border-l-4 border-amber-500 p-4 rounded shadow-sm">
        <h3 class="font-bold text-amber-800 text-sm uppercase">⚠️ Stock Bajo</h3>
        <ul id="lista-stock-bajo" class="text-sm text-amber-900 mt-1 list-disc list-inside"></ul>
      </div>
      <div id="alerta-caducidad" class="hidden bg-red-50 border-l-4 border-red-500 p-4 rounded shadow-sm">
        <h3 class="font-bold text-red-800 text-sm uppercase">⏳ Próximos a Caducar (30 días)</h3>
        <ul id="lista-caducidad" class="text-sm text-red-900 mt-1 list-disc list-inside"></ul>
      </div>
    </section>

    <!-- Formulario para agregar dulce -->
    <section class="bg-white p-5 rounded-lg shadow-sm border border-slate-200">
      <h2 class="text-lg font-semibold mb-4 text-slate-700">Agregar Nuevo Dulce</h2>
      <form id="form-dulce" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
        <input type="text" id="nombre" placeholder="Nombre (ej. Gomitas)" required
          class="border rounded px-3 py-2 text-sm focus:outline-pink-500" />
        <input type="text" id="marca" placeholder="Marca (ej. Ricolino)"
          class="border rounded px-3 py-2 text-sm focus:outline-pink-500" />
        <select id="categoria" class="border rounded px-3 py-2 text-sm bg-white focus:outline-pink-500">
          <option value="Gomitas">Gomitas</option>
          <option value="Chocolates">Chocolates</option>
          <option value="Caramelos">Caramelos</option>
          <option value="Chicles">Chicles</option>
          <option value="Botanas">Botanas</option>
        </select>
        <input type="date" id="fecha_caducidad" title="Fecha de caducidad"
          class="border rounded px-3 py-2 text-sm focus:outline-pink-500" />

        <input type="number" step="0.01" id="precio_compra" placeholder="Precio compra ($)" required
          class="border rounded px-3 py-2 text-sm focus:outline-pink-500" />
        <input type="number" step="0.01" id="precio_venta" placeholder="Precio venta ($)" required
          class="border rounded px-3 py-2 text-sm focus:outline-pink-500" />
        <input type="number" id="stock" placeholder="Stock inicial" required
          class="border rounded px-3 py-2 text-sm focus:outline-pink-500" />
        <input type="number" id="stock_minimo" placeholder="Stock mínimo (ej. 10)" value="10" required
          class="border rounded px-3 py-2 text-sm focus:outline-pink-500" />

        <button type="submit"
          class="sm:col-span-2 md:col-span-4 bg-pink-600 hover:bg-pink-700 text-white font-medium py-2 rounded transition">
          + Guardar en Inventario
        </button>
      </form>
    </section>

    <!-- Tabla de Inventario -->
    <section class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">
      <div class="p-4 border-b border-slate-200 flex flex-wrap justify-between items-center gap-2">
        <h2 class="text-lg font-semibold text-slate-700">Productos en Existencia</h2>
        <select id="filtro-categoria" onchange="cargarDatos()"
          class="border rounded px-3 py-1.5 text-sm bg-slate-50">
          <option value="">Todas las categorías</option>
          <option value="Gomitas">Gomitas</option>
          <option value="Chocolates">Chocolates</option>
          <option value="Caramelos">Caramelos</option>
          <option value="Chicles">Chicles</option>
          <option value="Botanas">Botanas</option>
        </select>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead class="bg-slate-50 text-slate-600 uppercase text-xs border-b">
            <tr>
              <th class="py-3 px-4">Producto</th>
              <th class="py-3 px-4">Categoría</th>
              <th class="py-3 px-4">Compra / Venta</th>
              <th class="py-3 px-4">Caducidad</th>
              <th class="py-3 px-4 text-center">Stock</th>
              <th class="py-3 px-4 text-right">Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-dulces" class="divide-y divide-slate-200"></tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    async function cargarDatos() {
      const cat = document.getElementById("filtro-categoria").value;
      const url = cat ? `/dulces/?categoria=${encodeURIComponent(cat)}` : "/dulces/";

      const [resDulces, resAlertas] = await Promise.all([
        fetch(url),
        fetch("/alertas/")
      ]);

      const dulces = await resDulces.json();
      const alertas = await resAlertas.json();

      renderTabla(dulces);
      renderAlertas(alertas);
    }

    function renderTabla(dulces) {
      const tbody = document.getElementById("tabla-dulces");
      if (dulces.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-slate-400">No hay dulces registrados aún.</td></tr>`;
        return;
      }

      tbody.innerHTML = dulces.map(d => {
        const bajo = d.stock <= d.stock_minimo;
        return `
          <tr class="hover:bg-slate-50">
            <td class="py-3 px-4">
              <div class="font-medium text-slate-900">${d.nombre}</div>
              <div class="text-xs text-slate-500">${d.marca || "Sin marca"}</div>
            </td>
            <td class="py-3 px-4">
              <span class="bg-slate-100 text-slate-700 px-2 py-0.5 rounded text-xs">${d.categoria}</span>
            </td>
            <td class="py-3 px-4">
              <span class="text-slate-400">$${d.precio_compra.toFixed(2)}</span> /
              <span class="font-semibold text-emerald-600">$${d.precio_venta.toFixed(2)}</span>
            </td>
            <td class="py-3 px-4 text-slate-600">${d.fecha_caducidad || "—"}</td>
            <td class="py-3 px-4 text-center">
              <span class="px-2.5 py-1 rounded-full font-bold text-xs ${bajo ? "bg-amber-100 text-amber-800" : "bg-emerald-100 text-emerald-800"}">
                ${d.stock} uds
              </span>
            </td>
            <td class="py-3 px-4 text-right space-x-1">
              <button onclick="moverStock(${d.id}, -1)" title="Vender 1"
                class="bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold px-2.5 py-1 rounded">-1</button>
              <button onclick="moverStock(${d.id}, 1)" title="Surtir 1"
                class="bg-emerald-100 hover:bg-emerald-200 text-emerald-700 font-bold px-2.5 py-1 rounded">+1</button>
              <button onclick="eliminarDulce(${d.id})" title="Eliminar"
                class="text-slate-400 hover:text-red-600 px-2 py-1">🗑️</button>
            </td>
          </tr>
        `;
      }).join("");
    }

    function renderAlertas(alertas) {
      const panel = document.getElementById("panel-alertas");
      const boxStock = document.getElementById("alerta-stock");
      const boxCad = document.getElementById("alerta-caducidad");

      const hayStock = alertas.stock_bajo.length > 0;
      const hayCad = alertas.proximos_a_caducar.length > 0;

      panel.classList.toggle("hidden", !hayStock && !hayCad);
      boxStock.classList.toggle("hidden", !hayStock);
      boxCad.classList.toggle("hidden", !hayCad);

      document.getElementById("lista-stock-bajo").innerHTML = alertas.stock_bajo
        .map(d => `<li><strong>${d.nombre}</strong>: quedan ${d.stock} uds (mínimo ${d.stock_minimo})</li>`).join("");

      document.getElementById("lista-caducidad").innerHTML = alertas.proximos_a_caducar
        .map(d => `<li><strong>${d.nombre}</strong>: vence el ${d.fecha_caducidad}</li>`).join("");
    }

    document.getElementById("form-dulce").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fecha = document.getElementById("fecha_caducidad").value;

      const payload = {
        nombre: document.getElementById("nombre").value,
        marca: document.getElementById("marca").value || null,
        categoria: document.getElementById("categoria").value,
        precio_compra: parseFloat(document.getElementById("precio_compra").value),
        precio_venta: parseFloat(document.getElementById("precio_venta").value),
        stock: parseInt(document.getElementById("stock").value),
        stock_minimo: parseInt(document.getElementById("stock_minimo").value),
        fecha_caducidad: fecha ? fecha : null
      };

      const res = await fetch("/dulces/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        e.target.reset();
        document.getElementById("stock_minimo").value = 10;
        cargarDatos();
      } else {
        alert("Error al guardar el producto.");
      }
    });

    async function moverStock(id, cantidad) {
      const res = await fetch(`/dulces/${id}/movimiento?cantidad=${cantidad}`, { method: "POST" });
      if (!res.ok) {
        const err = await res.json();
        alert(err.detail || "No se pudo actualizar el stock");
      }
      cargarDatos();
    }

    async function eliminarDulce(id) {
      if (!confirm("¿Seguro que deseas eliminar este dulce del inventario?")) return;
      await fetch(`/dulces/${id}`, { method: "DELETE" });
      cargarDatos();
    }

    // Cargar inventario al abrir la página
    cargarDatos();
  </script>
</body>
</html>
